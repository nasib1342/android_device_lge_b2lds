name: Build TWRP
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:18.04

    steps:
      - name: Install deps and JDK 8
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-8-jdk python git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip wget
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Verify JDK 8
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la $JAVA_HOME/lib/tools.jar || echo "ERROR: tools.jar not found!"

      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "Actions"
          git config --global user.email "a@b.c"
          git config --global --add safe.directory '*'

      - name: Init TWRP source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1 --depth=1

      - name: Add device tree to local manifest
        run: |
          mkdir -p ~/twrp/.repo/local_manifests
          cat > ~/twrp/.repo/local_manifests/b2lds.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="nasib1342/android_device_lge_b2lds" path="device/lge/b2lds" remote="github" revision="main" />
          </manifest>
          EOF
          echo "=== Local manifest content ===" && cat ~/twrp/.repo/local_manifests/b2lds.xml

      - name: Sync TWRP source
        run: cd ~/twrp && ~/bin/repo sync -j8 --force-sync --no-clone-bundle --no-tags

      - name: Fix b21ds typo
        run: |
          cd ~/twrp/device/lge/b2lds
          for f in $(find . -name '*b21ds*'); do mv "$f" "$(echo $f | sed 's/b21ds/b2lds/g')"; done
          grep -rl 'b21ds' . | xargs sed -i 's/b21ds/b2lds/g' || true
          echo "=== FILES ===" && ls -la
          echo "=== AndroidProducts.mk ===" && cat AndroidProducts.mk
          echo "=== omni_b2lds.mk ===" && cat omni_b2lds.mk
          echo "=== vendorsetup.sh ===" && cat vendorsetup.sh

      - name: Fix Python 2 syntax
        run: sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' ~/twrp/build/tools/roomservice.py

      - name: Build TWRP
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ls -la $JAVA_HOME/lib/tools.jar || echo "ERROR: tools.jar missing!"
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_b2lds-eng
          make -j8 recoveryimage

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: ~/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
