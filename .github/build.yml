name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip

      - name: Setup repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          "$HOME/bin/repo" init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1 --depth=1

      - name: Sync TWRP source
        run: |
          cd "$HOME/twrp"
          for i in 1 2 3; do
            "$HOME/bin/repo" sync -j4 --force-sync --no-clone-bundle --no-tags && break
            sleep 60
          done

      - name: Create GPS file in TWRP source
        run: |
          mkdir -p "$HOME/twrp/device/common/gps"
          echo 'PRODUCT_COPY_FILES := device/common/gps/gps.conf_US_SUPL:system/etc/gps.conf' > "$HOME/twrp/device/common/gps/gps_us_supl.mk"
          echo "Created: $HOME/twrp/device/common/gps/gps_us_supl.mk"
          cat "$HOME/twrp/device/common/gps/gps_us_supl.mk"

      - name: Create ALL Device Tree Files from scratch
        run: |
          TARGET_DIR="$HOME/twrp/device/lge/b2lds"
          mkdir -p "$TARGET_DIR"
          mkdir -p "$TARGET_DIR/prebuilt"
          mkdir -p "$TARGET_DIR/recovery"
          
          # Copy prebuilt kernel and recovery.fstab from repo
          cp -r "$GITHUB_WORKSPACE/devicetree/prebuilt/"* "$TARGET_DIR/prebuilt/" 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/devicetree/recovery/"* "$TARGET_DIR/recovery/" 2>/dev/null || true
          
          cd "$TARGET_DIR"

          # --- device_b2lds.mk (CLEAN, no gps reference) ---
          cat > device_b2lds.mk <<'MKEOF'
LOCAL_PATH := device/lge/b2lds

# Architecture
TARGET_ARCH := arm
TARGET_CPU_ABI := armeabi-v7a
TARGET_CPU_ABI2 := armeabi
TARGET_ARCH_VARIANT := armv7-a-neon
TARGET_CPU_VARIANT := cortex-a7
TARGET_CPU_SMP := true

# Platform
TARGET_BOARD_PLATFORM := mt6582
TARGET_NO_BOOTLOADER := true
TARGET_BOOTLOADER_BOARD_NAME := mt6582

# Kernel
TARGET_PREBUILT_KERNEL := $(LOCAL_PATH)/prebuilt/kernel
BOARD_KERNEL_BASE := 0x80000000
BOARD_KERNEL_PAGESIZE := 2048
BOARD_MKBOOTIMG_ARGS := --base 0x80000000 --pagesize 2048 --kernel_offset 0x00008000 --ramdisk_offset 0x04000000 --tags_offset 0x00000100 --mtk 1

# Recovery
TARGET_RECOVERY_FSTAB := $(LOCAL_PATH)/recovery/recovery.fstab
TARGET_USERIMAGES_USE_EXT4 := true
BOARD_HAS_LARGE_FILESYSTEM := true

# MTK Hardware
BOARD_HAS_MTK_HARDWARE := true
MTK_HARDWARE := true

# Partitions
BOARD_BOOTIMAGE_PARTITION_SIZE := 16777216
BOARD_RECOVERYIMAGE_PARTITION_SIZE := 16777216
BOARD_SYSTEMIMAGE_PARTITION_SIZE := 2147483648
BOARD_USERDATAIMAGE_PARTITION_SIZE := 4613734400
BOARD_CACHEIMAGE_PARTITION_SIZE := 838860800
BOARD_FLASH_BLOCK_SIZE := 131072
MKEOF

          # --- omni_b2lds.mk ---
          cat > omni_b2lds.mk <<'MKEOF'
$(call inherit-product, device/lge/b2lds/device_b2lds.mk)
$(call inherit-product, vendor/omni/config/common.mk)

PRODUCT_NAME := omni_b2lds
PRODUCT_DEVICE := b2lds
PRODUCT_BRAND := lge
PRODUCT_MODEL := LG-D690
PRODUCT_MANUFACTURER := lge
MKEOF

          # --- AndroidProducts.mk ---
          cat > AndroidProducts.mk <<'MKEOF'
PRODUCT_MAKEFILES := \
    $(LOCAL_DIR)/omni_b2lds.mk
MKEOF

          # --- vendorsetup.sh ---
          echo "add_lunch_combo omni_b2lds-eng" > vendorsetup.sh

          # --- BoardConfig.mk ---
          cat > BoardConfig.mk <<'MKEOF'
LOCAL_PATH := device/lge/b2lds

TARGET_BOARD_PLATFORM := mt6582
TARGET_NO_BOOTLOADER := true
TARGET_ARCH := arm
TARGET_CPU_ABI := armeabi-v7a
TARGET_CPU_ABI2 := armeabi
TARGET_ARCH_VARIANT := armv7-a-neon
TARGET_CPU_VARIANT := cortex-a7
TARGET_BOOTLOADER_BOARD_NAME := mt6582

BOARD_BOOTIMAGE_PARTITION_SIZE := 16777216
BOARD_RECOVERYIMAGE_PARTITION_SIZE := 16777216
BOARD_SYSTEMIMAGE_PARTITION_SIZE := 2147483648
BOARD_USERDATAIMAGE_PARTITION_SIZE := 4613734400
BOARD_CACHEIMAGE_PARTITION_SIZE := 838860800
BOARD_CACHEIMAGE_FILE_SYSTEM_TYPE := ext4
BOARD_FLASH_BLOCK_SIZE := 131072

TARGET_PREBUILT_KERNEL := $(LOCAL_PATH)/prebuilt/kernel
TARGET_RECOVERY_FSTAB := $(LOCAL_PATH)/recovery/recovery.fstab

BOARD_KERNEL_BASE := 0x80000000
BOARD_KERNEL_PAGESIZE := 2048
BOARD_MKBOOTIMG_ARGS := --base 0x80000000 --pagesize 2048 --kernel_offset 0x00008000 --ramdisk_offset 0x04000000 --tags_offset 0x00000100 --mtk 1

BOARD_HAS_MTK_HARDWARE := true
MTK_HARDWARE := true

TARGET_USERIMAGES_USE_EXT4 := true
BOARD_HAS_LARGE_FILESYSTEM := true

# TWRP Settings
TW_THEME := portrait_mdpi
TW_BRIGHTNESS_PATH := /sys/class/leds/lcd-backlight/brightness
TW_MAX_BRIGHTNESS := 255
TW_SCREEN_BLANK_ON_BOOT := true
RECOVERY_GRAPHICS_USE_LINELENGTH := true

DEVICE_RESOLUTION := 540x960
TARGET_SCREEN_WIDTH := 540
TARGET_SCREEN_HEIGHT := 960
MKEOF

          # ====================
          # FINAL VERIFICATION
          # ====================
          echo "=================== ALL FILES ==================="
          ls -la
          echo ""
          echo "=================== CHECK gps_us_supl ==================="
          grep -rn 'gps_us_supl' . && echo "!!! FOUND IN DEVICE TREE !!!" || echo "OK: No gps_us_supl in device tree"
          echo ""
          echo "=================== device_b2lds.mk ==================="
          cat device_b2lds.mk

      - name: Fix Python 2 syntax
        run: |
          sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' "$HOME/twrp/build/tools/roomservice.py"

      - name: Build TWRP
        run: |
          cd "$HOME/twrp"
          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          export OUT_DIR=out
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "=== Verify gps file exists ==="
          ls -la device/common/gps/gps_us_supl.mk

          echo "=== Verify device tree files ==="
          ls -la device/lge/b2lds/

          source build/envsetup.sh
          lunch omni_b2lds-eng
          make -j4 recoveryimage

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: /home/runner/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
