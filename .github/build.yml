name: Build TWRP
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:18.04
    steps:
      - name: Install deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-8-jdk python git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip wget
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-8-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Verify JDK
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la $JAVA_HOME/lib/tools.jar

      - name: Setup repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Config git
        run: |
          git config --global user.name "Actions"
          git config --global user.email "a@b.c"
          git config --global --add safe.directory '*'

      - name: Init TWRP
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1 --depth=1

      - name: Sync TWRP
        run: cd ~/twrp && ~/bin/repo sync -j8 --force-sync --no-clone-bundle --no-tags

      - name: Copy and Fix device tree
        run: |
          mkdir -p ~/twrp/device/lge/b2lds
          cp -r $GITHUB_WORKSPACE/devicetree/* ~/twrp/device/lge/b2lds/
          cd ~/twrp/device/lge/b2lds
          for f in $(find . -name '*b21ds*'); do mv "$f" "$(echo $f | sed 's/b21ds/b2lds/g')"; done
          grep -rl 'b21ds' . | xargs sed -i 's/b21ds/b2lds/g' || true
          printf 'PRODUCT_MAKEFILES := device/lge/b2lds/omni_b2lds.mk\n' > AndroidProducts.mk
          printf '$(call inherit-product, device/lge/b2lds/device_b2lds.mk)\n$(call inherit-product, vendor/omni/config/common.mk)\n\nPRODUCT_NAME := omni_b2lds\nPRODUCT_DEVICE := b2lds\nPRODUCT_BRAND := lge\nPRODUCT_MODEL := LG-D690\nPRODUCT_MANUFACTURER := lge\n' > omni_b2lds.mk
          printf 'add_lunch_combo omni_b2lds-eng\n' > vendorsetup.sh
          echo "=== DEBUG: AndroidProducts.mk ===" && cat AndroidProducts.mk
          echo "=== DEBUG: omni_b2lds.mk ===" && cat omni_b2lds.mk
          echo "=== DEBUG: vendorsetup.sh ===" && cat vendorsetup.sh

      - name: Fix Python 2
        run: sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' ~/twrp/build/tools/roomservice.py

      - name: Build TWRP
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_b2lds-eng
          make -j8 recoveryimage

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: ~/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
