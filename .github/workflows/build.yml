name: Build TWRP for LG-D690 b2lds

on:
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: 'TWRP branch (twrp-5.1 or twrp-6.0)'
        required: true
        default: 'twrp-5.1'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v3
        with:
          path: devicetree

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk python3 git gnupg flex bison gperf \
            build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip \
            python3-pip

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source
        run: |
          mkdir -p ~/twrp
          cd ~/twrp
          ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b ${{ github.event.inputs.twrp_branch }} --depth=1

      - name: Sync TWRP source
        run: |
          cd ~/twrp
          ~/bin/repo sync -j8 --force-sync --no-clone-bundle --no-tags

      - name: Copy device tree
        run: |
          mkdir -p ~/twrp/device/lge/b2lds
          cp -r $GITHUB_WORKSPACE/devicetree/* ~/twrp/device/lge/b2lds/

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          lunch omni_b2lds-eng
          make -j8 recoveryimage

      - name: Upload TWRP image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: ~/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
