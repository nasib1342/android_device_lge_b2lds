name: Build TWRP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python2 git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev ccache libgl1-mesa-dev \
            libxml2-utils xsltproc unzip

      - name: Verify Java
        run: |
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version
          javac -version
          test -f "$ANDROID_JAVA_HOME/lib/tools.jar" || {
            echo "ERROR: JDK 8 tools.jar not found"
            exit 1
          }
          echo "JDK 8 tools.jar OK"

      - name: Setup repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          "$HOME/bin/repo" init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-5.1 --depth=1

      - name: Add device/common to local manifest
        run: |
          mkdir -p "$HOME/twrp/.repo/local_manifests"
          cat > "$HOME/twrp/.repo/local_manifests/device_common.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/common" name="device/common" remote="aosp" revision="refs/tags/android-5.1.1_r28" />
          </manifest>
          XMLEOF
          echo "=== Local manifest ==="
          cat "$HOME/twrp/.repo/local_manifests/device_common.xml"

      - name: Sync TWRP source
        run: |
          cd "$HOME/twrp"
          for attempt in 1 2 3 4; do
            echo "Sync attempt $attempt of 4"
            if "$HOME/bin/repo" sync -j2 --force-sync --no-clone-bundle --no-tags; then
              echo "Source sync completed"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Sync failed; retrying in 25 seconds"
              sleep 25
            fi
          done
          echo "ERROR: Source sync failed after 4 attempts"
          exit 1

      - name: Verify device/common GPS file
        run: |
          test -f "$HOME/twrp/device/common/gps/gps_us_supl.mk" || {
            echo "ERROR: device/common/gps/gps_us_supl.mk is missing"
            exit 1
          }
          echo "device/common GPS makefile is present"

      - name: Copy and Fix Device Tree
        run: |
          TARGET_DIR="$HOME/twrp/device/lge/b2lds"
          mkdir -p "$TARGET_DIR"
          find "$GITHUB_WORKSPACE/devicetree" -mindepth 1 -maxdepth 1 ! -name .git \
            -exec cp -a {} "$TARGET_DIR/" \;
          cd "$TARGET_DIR"

          find . -depth -name '*b21ds*' -exec sh -c '
            for f do
              mv "$f" "$(printf "%s" "$f" | sed "s/b21ds/b2lds/g")"
            done
          ' sh {} +
          grep -rlI 'b21ds' . | xargs -r sed -i 's/b21ds/b2lds/g'

          python3 - <<'PY'
          from pathlib import Path

          p = Path("BoardConfig.mk")
          old = "$(shell mkdir -p $(OUT)/obj/KERNEL_OBJ/usr)"
          fixed = "$(shell mkdir -p out/obj/KERNEL_OBJ/usr)"
          lines = p.read_text().splitlines()
          changed = False
          new_lines = []
          for line in lines:
              if line.strip() == old:
                  new_lines.append(fixed)
                  changed = True
              else:
                  new_lines.append(line)
          p.write_text("\n".join(new_lines) + "\n")
          if changed:
              print("Fixed BoardConfig.mk path: using relative out/ instead of /obj")
          elif any(line.strip() == fixed for line in lines):
              print("BoardConfig.mk output path already fixed")
          else:
              print("No legacy OUT mkdir line found; continuing")
          PY

          cat > AndroidProducts.mk <<'MAKEEOF'
          PRODUCT_MAKEFILES := device/lge/b2lds/omni_b2lds.mk
          MAKEEOF

          cat > omni_b2lds.mk <<'MAKEEOF'
          $(call inherit-product, device/lge/b2lds/device_b2lds.mk)
          $(call inherit-product, vendor/omni/config/common.mk)

          PRODUCT_NAME := omni_b2lds
          PRODUCT_DEVICE := b2lds
          PRODUCT_BRAND := lge
          PRODUCT_MODEL := LG-D690
          PRODUCT_MANUFACTURER := lge
          MAKEEOF

          echo '[]' > omni.dependencies
          echo "add_lunch_combo omni_b2lds-eng" > vendorsetup.sh

          echo "=== AndroidProducts.mk ==="
          cat AndroidProducts.mk
          echo "=== omni_b2lds.mk ==="
          cat omni_b2lds.mk
          echo "=== BoardConfig OUT hack ==="
          grep -n 'mkdir -p.*OUT.*/obj/KERNEL_OBJ/usr' BoardConfig.mk || true

      - name: Fix Python 2 syntax
        run: |
          FILE="$HOME/twrp/build/tools/roomservice.py"
          if [ -f "$FILE" ]; then
            sed -i \
              's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' \
              "$FILE"
          fi

      - name: Build TWRP
        run: |
          cd "$HOME/twrp"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          export OUT_DIR="$HOME/twrp/out"
          export OUT="$OUT_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "=== Java environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version
          test -f "$ANDROID_JAVA_HOME/lib/tools.jar"

          echo "=== Checking required files ==="
          test -f device/lge/b2lds/AndroidProducts.mk
          test -f device/lge/b2lds/omni_b2lds.mk
          test -f device/lge/b2lds/device_b2lds.mk
          test -f device/lge/b2lds/prebuilt/kernel
          test -f device/common/gps/gps_us_supl.mk
          test -f vendor/omni/config/common.mk

          source build/envsetup.sh
          lunch omni_b2lds-eng
          make -j4 recoveryimage

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: /home/runner/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
