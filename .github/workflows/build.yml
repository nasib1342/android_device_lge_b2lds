name: Build TWRP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python2 git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev lz4 \
            libx11-dev lib32z-dev ccache libgl1-mesa-dev \
            libxml2-utils xsltproc unzip

      - name: Verify Java
        run: |
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version
          javac -version
          test -f "$ANDROID_JAVA_HOME/lib/tools.jar" || {
            echo "ERROR: JDK 8 tools.jar not found"
            exit 1
          }
          echo "JDK 8 tools.jar OK"

      - name: Setup repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          "$HOME/bin/repo" init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-5.1 --depth=1

      - name: Add missing legacy projects to local manifest
        run: |
          mkdir -p "$HOME/twrp/.repo/local_manifests"
          cat > "$HOME/twrp/.repo/local_manifests/b2lds_dependencies.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/common" name="device/common" remote="aosp" revision="refs/tags/android-5.1.1_r28" />
            <project path="external/wpa_supplicant_8" name="android_external_wpa_supplicant_8" remote="omnirom" revision="android-5.1" groups="pdk" />
          </manifest>
          XMLEOF
          echo "=== Local manifest for b2lds ==="
          cat "$HOME/twrp/.repo/local_manifests/b2lds_dependencies.xml"

      - name: Sync TWRP source
        run: |
          cd "$HOME/twrp"
          for attempt in 1 2 3 4; do
            echo "Sync attempt $attempt of 4"
            if "$HOME/bin/repo" sync -j2 --force-sync --no-clone-bundle --no-tags; then
              echo "Source sync completed"
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Sync failed; retrying in 25 seconds"
              sleep 25
            fi
          done
          echo "ERROR: Source sync failed after 4 attempts"
          exit 1

      - name: Fix legacy checkpolicy linker error
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/twrp"

          echo "=== Fix GCC multiple-definition error in checkpolicy ==="
          python3 - <<'PY'
          from pathlib import Path

          p = Path.home() / "twrp/external/checkpolicy/Android.mk"
          if not p.is_file():
              raise SystemExit(f"ERROR: file not found: {p}")

          text = p.read_text()
          marker = "-Wno-return-type"

          if "-fcommon" in text:
              print("The -fcommon compatibility flag is already present")
          elif text.count(marker) == 1:
              p.write_text(text.replace(marker, marker + " -fcommon", 1))
              print("SUCCESS: added -fcommon to checkpolicy common_cflags")
          else:
              raise SystemExit(
                  "ERROR: expected one -Wno-return-type entry in "
                  "external/checkpolicy/Android.mk; no change made"
              )

          updated = p.read_text()
          if "-fcommon" not in updated:
              raise SystemExit("ERROR: -fcommon verification failed")
          print("SUCCESS: checkpolicy Android.mk verification passed")
          PY
          grep -n -E 'common_cflags|Wno-return-type|fcommon' \
            "$HOME/twrp/external/checkpolicy/Android.mk"

      - name: Fix legacy C++ nullptr compatibility
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Fix nullptr in legacy TWRP partition.cpp ==="
          python3 - <<'PYFIX'
          from pathlib import Path

          p = Path.home() / "twrp/bootable/recovery/partition.cpp"
          if not p.is_file():
              raise SystemExit(f"ERROR: partition.cpp not found: {p}")

          text = p.read_text()
          old = "sml != nullptr"
          new = "sml != 0"

          if text.count(old) == 1:
              p.write_text(text.replace(old, new, 1))
              print("SUCCESS: replaced legacy-incompatible nullptr check")
          elif text.count(new) == 1 and old not in text:
              print("Already fixed: nullptr check uses 0")
          else:
              raise SystemExit(
                  "ERROR: expected exactly one 'sml != nullptr' expression; "
                  "source was not modified"
              )

          updated = p.read_text()
          if old in updated or new not in updated:
              raise SystemExit("ERROR: partition.cpp verification failed")

          print("SUCCESS: partition.cpp compatibility check passed")
          PYFIX
          grep -n -F 'sml != 0' "$HOME/twrp/bootable/recovery/partition.cpp"

      - name: Verify required legacy source files
        run: |
          test -f "$HOME/twrp/device/common/gps/gps_us_supl.mk" || {
            echo "ERROR: device/common/gps/gps_us_supl.mk is missing"
            exit 1
          }
          test -f "$HOME/twrp/external/wpa_supplicant_8/wpa_supplicant/android.config" || {
            echo "ERROR: external/wpa_supplicant_8 was not synced or android.config is missing"
            exit 1
          }
          echo "device/common GPS and wpa_supplicant source files are present"

      - name: Fix TWRP recovery module registration
        run: |
          RECOVERY_MK="$HOME/twrp/bootable/recovery/Android.mk"
          test -f "$RECOVERY_MK" || {
            echo "ERROR: bootable/recovery/Android.mk is missing"
            exit 1
          }
          python3 - <<'PYFIX'
          from pathlib import Path
          p = Path.home() / "twrp/bootable/recovery/Android.mk"
          text = p.read_text()
          old = "ifeq ($(PROJECT_PATH_AGREES),true)"
          new = "ifeq (true,true)"
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
              print("Enabled the recovery module for bootable/recovery")
          elif new in text and "LOCAL_MODULE := recovery" in text:
              print("Recovery module path guard was already fixed")
          else:
              raise SystemExit("ERROR: expected TWRP recovery module guard not found")
          if "LOCAL_MODULE := recovery" not in text:
              raise SystemExit("ERROR: recovery module definition was not found")
          PYFIX
          grep -n -E 'ifeq \(true,true\)|LOCAL_MODULE := recovery' "$RECOVERY_MK" | head -10

      - name: Copy and Fix Device Tree
        run: |
          TARGET_DIR="$HOME/twrp/device/lge/b2lds"
          mkdir -p "$TARGET_DIR"
          find "$GITHUB_WORKSPACE/devicetree" -mindepth 1 -maxdepth 1 ! -name .git \
            -exec cp -a {} "$TARGET_DIR/" \;
          cd "$TARGET_DIR"
          find . -depth -name '*b21ds*' -exec sh -c '
            for f do
              mv "$f" "$(printf "%s" "$f" | sed "s/b21ds/b2lds/g")"
            done
          ' sh {} +
          grep -rlI 'b21ds' . | xargs -r sed -i 's/b21ds/b2lds/g'
          python3 - <<'PY'
          from pathlib import Path
          p = Path("BoardConfig.mk")
          text = p.read_text()
          old_out = "$(shell mkdir -p $(OUT)/obj/KERNEL_OBJ/usr)"
          new_out = "$(shell mkdir -p $(OUT_DIR)/obj/KERNEL_OBJ/usr)"
          if old_out in text:
              text = text.replace(old_out, new_out)
              print("Fixed BoardConfig.mk KERNEL_OBJ output path")
          elif new_out in text:
              print("BoardConfig.mk KERNEL_OBJ output path already fixed")
          else:
              print("No legacy KERNEL_OBJ mkdir line found; continuing")
          old_mtk = "BOARD_CUSTOM_MKBOOTIMG := mtkbootimg"
          new_mtk = "BOARD_CUSTOM_MKBOOTIMG = $(HOST_OUT_EXECUTABLES)/mtkbootimg"
          if old_mtk in text:
              text = text.replace(old_mtk, new_mtk)
              print("Fixed BOARD_CUSTOM_MKBOOTIMG path")
          elif new_mtk in text:
              print("BOARD_CUSTOM_MKBOOTIMG path already fixed")
          else:
              raise SystemExit("ERROR: BOARD_CUSTOM_MKBOOTIMG setting not found")
          p.write_text(text)
          PY

          echo "=== MTK boot-image tool source files ==="
          test -f mtkbootimg/Android.mk
          test -f mtkbootimg/mkbootimg.c
          test -f mtkbootimg/bootimg.h
          grep -n 'BOARD_CUSTOM_MKBOOTIMG' BoardConfig.mk
          cat > AndroidProducts.mk <<'MAKEEOF'
          PRODUCT_MAKEFILES := device/lge/b2lds/omni_b2lds.mk
          MAKEEOF
          cat > omni_b2lds.mk <<'MAKEEOF'
          $(call inherit-product, device/lge/b2lds/device_b2lds.mk)
          $(call inherit-product, vendor/omni/config/common.mk)
          PRODUCT_NAME := omni_b2lds
          PRODUCT_DEVICE := b2lds
          PRODUCT_BRAND := lge
          PRODUCT_MODEL := LG-D690
          PRODUCT_MANUFACTURER := lge
          PRODUCT_PACKAGES += recovery
          MAKEEOF
          echo '[]' > omni.dependencies
          echo "add_lunch_combo omni_b2lds-eng" > vendorsetup.sh
          echo "=== AndroidProducts.mk ==="
          cat AndroidProducts.mk
          echo "=== omni_b2lds.mk ==="
          cat omni_b2lds.mk
          echo "=== BoardConfig output workaround ==="
          grep -n 'mkdir -p.*OUT.*/obj/KERNEL_OBJ/usr' BoardConfig.mk || true

      - name: Configure Python 2 for legacy Android build tools
        run: |
          test -x /usr/bin/python2 || {
            echo "ERROR: python2 is not installed"
            exit 1
          }
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/python" <<'PYWRAP'
          #!/bin/sh
          exec /usr/bin/python2 "$@"
          PYWRAP
          chmod +x "$HOME/bin/python"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          echo "=== Python selected for Android 5.1 build ==="
          command -v python
          python --version
          python3 --version
          python -m py_compile "$HOME/twrp/build/tools/findleaves.py"
          python -m py_compile "$HOME/twrp/build/tools/diff_package_overlays.py"
          echo "Legacy Python 2 build scripts parse successfully"

      - name: Build TWRP
        shell: bash
        run: |
          cd "$HOME/twrp"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$HOME/bin:$JAVA_HOME/bin:$PATH"
          export OUT_DIR="$HOME/twrp/out"
          export OUT="$OUT_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          echo "=== Java environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version
          test -f "$ANDROID_JAVA_HOME/lib/tools.jar"

          echo "=== Python environment ==="
          command -v python
          python --version
          python3 --version
          echo "=== Checking required files ==="
          test -f device/lge/b2lds/AndroidProducts.mk
          test -f device/lge/b2lds/omni_b2lds.mk
          test -f device/lge/b2lds/device_b2lds.mk
          test -f device/lge/b2lds/prebuilt/kernel
          test -f device/common/gps/gps_us_supl.mk
          test -f external/wpa_supplicant_8/wpa_supplicant/android.config
          test -f vendor/omni/config/common.mk

          source build/envsetup.sh
          lunch omni_b2lds-eng
          echo "=== Bootstrap host acp helper ==="
          mkdir -p "$OUT_DIR/host/linux-x86/bin"
          ln -sf /bin/cp "$OUT_DIR/host/linux-x86/bin/acp"
          test -x "$OUT_DIR/host/linux-x86/bin/acp"
          echo "=== Build MTK boot-image tool ==="
          test -f device/lge/b2lds/mtkbootimg/mkbootimg.c
          test -f device/lge/b2lds/mtkbootimg/bootimg.h
          test -f system/core/libmincrypt/sha.c
          test -f system/core/include/mincrypt/sha.h
          gcc -O2 -Wall -Wno-unused-parameter \
            -I system/core/include \
            -I device/lge/b2lds/mtkbootimg \
            device/lge/b2lds/mtkbootimg/mkbootimg.c \
            system/core/libmincrypt/sha.c \
            -o "$OUT_DIR/host/linux-x86/bin/mtkbootimg"
          chmod +x "$OUT_DIR/host/linux-x86/bin/mtkbootimg"
          test -x "$OUT_DIR/host/linux-x86/bin/mtkbootimg"
          grep -n 'BOARD_CUSTOM_MKBOOTIMG' device/lge/b2lds/BoardConfig.mk
          echo "=== Build zlib host tools ==="
          test -f external/zlib/Android.mk
          if ! mmm external/zlib; then
            echo "WARNING: external/zlib host build did not fully complete"
          fi
          if [ ! -x "$OUT_DIR/host/linux-x86/bin/minigzip" ]; then
            echo "Using /usr/bin/gzip as the minigzip fallback"
            ln -sf /usr/bin/gzip "$OUT_DIR/host/linux-x86/bin/minigzip"
          fi
          test -x "$OUT_DIR/host/linux-x86/bin/minigzip"
          echo "=== Build AOSP mkbootfs ==="
          test -f system/core/cpio/Android.mk
          test -f system/core/cpio/mkbootfs.c
          mmm system/core/cpio
          test -x "$OUT_DIR/host/linux-x86/bin/mkbootfs" || {
            echo "ERROR: mkbootfs executable was not generated"
            exit 1
          }

          echo "=== Verify recovery module is registered ==="
          grep -n 'LOCAL_MODULE := recovery' bootable/recovery/Android.mk
          echo "=== Build TWRP recovery image ==="
          make -j4 recoveryimage

      - name: Build genuine ARM32 adbd for recovery
        shell: bash
        run: |
          set -eo pipefail
          cd "$HOME/twrp"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$HOME/bin:$JAVA_HOME/bin:$PATH"
          export OUT_DIR="$HOME/twrp/out"
          export OUT="$OUT_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch omni_b2lds-eng
          make -j4 adbd
          # Android 5.1 normally installs adbd into system/bin, but some
          # recovery trees also copy it into recovery/root/sbin.
          PROD="$OUT_DIR/target/product/b2lds"
          ADBD=""
          for candidate in \
            "$PROD/recovery/root/sbin/adbd" \
            "$PROD/system/bin/adbd" \
            "$PROD/root/sbin/adbd"; do
            if [ -s "$candidate" ]; then
              ADBD="$candidate"
              break
            fi
          done
          if [ -z "$ADBD" ]; then
            echo "ERROR: make adbd succeeded but no ARM adbd output was found"
            find "$PROD" -name adbd -print || true
            exit 1
          fi
          python3 - "$ADBD" <<'PYCHECK'
          from pathlib import Path
          import struct, sys
          p = Path(sys.argv[1])
          data = p.read_bytes()
          if (data[:5] != b'\x7fELF\x01' or
              struct.unpack_from('<H', data, 18)[0] != 40):
              raise SystemExit(f'ERROR: adbd is not ARM32 ELF: {p}')
          print('Validated ARM32 adbd:', p, len(data), 'bytes')
          PYCHECK
          echo "BUILT_ADBD=$ADBD" >> "$GITHUB_ENV"
          file "$ADBD"

      - name: Repack recovery ramdisk as LG LZ4 Legacy
        shell: bash
        run: |
          set -euo pipefail
          IMG="$HOME/twrp/out/target/product/b2lds/recovery.img"
          RC="$GITHUB_WORKSPACE/devicetree/rootdir/init.recovery.b2lds.rc"
          test -s "$IMG"
          test -n "${BUILT_ADBD:-}"
          test -s "$BUILT_ADBD"
          test -s "$RC"
          python3 "$GITHUB_WORKSPACE/devicetree/scripts/repack_recovery_v3.py" \
            --image "$IMG" \
            --adbd "$BUILT_ADBD" \
            --device-rc "$RC" \
            --output "$IMG.lz4.new"
          mv "$IMG.lz4.new" "$IMG"

      - name: Audit built recovery (no flashing)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/devicetree/scripts/audit_recovery.py" \
            --image "$HOME/twrp/out/target/product/b2lds/recovery.img" \
            --kernel "$GITHUB_WORKSPACE/devicetree/prebuilt/kernel"

      - name: Upload TWRP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: /home/runner/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
