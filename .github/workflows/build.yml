name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python2 git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev ccache libgl1-mesa-dev \
            libxml2-utils xsltproc unzip

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          test -f "$JAVA_HOME/lib/tools.jar" || {
            echo "ERROR: JDK 8 tools.jar not found"
            exit 1
          }
          echo "JDK 8 tools.jar OK"

      - name: Setup repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          "$HOME/bin/repo" init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-5.1 --depth=1

      - name: Sync TWRP source
            - name: Init TWRP source
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          "$HOME/bin/repo" init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-5.1 --depth=1

      - name: Sync TWRP source
        run: |
          cd "$HOME/twrp"
          for attempt in 1 2 3 4; do
            echo "Sync attempt $attempt of 4"
            if "$HOME/bin/repo" sync -j2 --force-sync --no-clone-bundle --no-tags; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Copy and Fix Device Tree
        run: |
          mkdir -p "$HOME/twrp/device/lge/b2lds"
          cp -r "$GITHUB_WORKSPACE/devicetree/"* \
            "$HOME/twrp/device/lge/b2lds/"

          cd "$HOME/twrp/device/lge/b2lds"

          find . -depth -name '*b21ds*' -exec sh -c '
            for f do
              mv "$f" "$(printf "%s" "$f" | sed "s/b21ds/b2lds/g")"
            done
          ' sh {} +

          grep -rl 'b21ds' . | xargs -r sed -i 's/b21ds/b2lds/g'

          python3 - <<'PY'
          from pathlib import Path

          p = Path("BoardConfig.mk")
          s = p.read_text()
          old = "$(shell mkdir -p $(OUT)/obj/KERNEL_OBJ/usr)"
          new = "$(shell mkdir -p $(OUT_DIR)/obj/KERNEL_OBJ/usr)"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("Fixed BoardConfig.mk OUT path")
          elif new in s:
              print("BoardConfig.mk OUT_DIR path already fixed")
          else:
              raise SystemExit("ERROR: Expected output-directory line not found")
          PY

          cat > AndroidProducts.mk <<'EOF'
          PRODUCT_MAKEFILES := $(LOCAL_DIR)/omni_b2lds.mk
          EOF

          cat > omni_b2lds.mk <<'EOF'
          $(call inherit-product, device/lge/b2lds/device_b2lds.mk)
          $(call inherit-product, vendor/omni/config/common.mk)

          PRODUCT_NAME := omni_b2lds
          PRODUCT_DEVICE := b2lds
          PRODUCT_BRAND := lge
          PRODUCT_MODEL := LG-D690
          PRODUCT_MANUFACTURER := lge
          EOF

          echo "add_lunch_combo omni_b2lds-eng" > vendorsetup.sh

          echo "=== AndroidProducts.mk ==="
          cat AndroidProducts.mk

          echo "=== omni_b2lds.mk ==="
          cat omni_b2lds.mk

          echo "=== BoardConfig output path ==="
          grep -n 'KERNEL_OBJ/usr' BoardConfig.mk

      - name: Fix Python 2 syntax
        run: |
          FILE="$HOME/twrp/build/tools/roomservice.py"
          if [ -f "$FILE" ]; then
            sed -i \
              's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' \
              "$FILE"
          fi

      - name: Build TWRP
        run: |
          cd "$HOME/twrp"

          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          export OUT_DIR="$HOME/twrp/out"
          export OUT="$OUT_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "=== Java ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version

          test -f "$ANDROID_JAVA_HOME/lib/tools.jar"

          echo "=== Checking required files ==="
          test -f device/lge/b2lds/AndroidProducts.mk
          test -f device/lge/b2lds/omni_b2lds.mk
          test -f device/lge/b2lds/device_b2lds.mk
          test -f vendor/omni/config/common.mk

          echo "=== Preparing build environment ==="
          source build/envsetup.sh

          echo "=== Selecting product ==="
          lunch omni_b2lds-eng

          echo "=== Building recovery image ==="
          make -j4 recoveryimage

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: /home/runner/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
