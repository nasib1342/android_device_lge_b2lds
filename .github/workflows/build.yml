name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip

      - name: Setup repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source (5.1)
        run: |
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"
          "$HOME/bin/repo" init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1 --depth=1

      - name: Add device/common to local manifest
        run: |
          mkdir -p "$HOME/twrp/.repo/local_manifests"
          cat > "$HOME/twrp/.repo/local_manifests/device_common.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="platform/device/common" path="device/common" remote="aosp" revision="android-5.1.1_r28" />
          </manifest>
          XMLEOF
          echo "=== Local manifest created ==="
          cat "$HOME/twrp/.repo/local_manifests/device_common.xml"

      - name: Sync TWRP source
        run: |
          cd "$HOME/twrp"
          for i in 1 2 3; do
            "$HOME/bin/repo" sync -j4 --force-sync --no-clone-bundle --no-tags && break
            sleep 60
          done

      - name: Verify gps_us_supl.mk exists
        run: |
          if [ -f "$HOME/twrp/device/common/gps/gps_us_supl.mk" ]; then
            echo "SUCCESS: gps_us_supl.mk found!"
            cat "$HOME/twrp/device/common/gps/gps_us_supl.mk"
          else
            echo "ERROR: gps_us_supl.mk still missing!"
            exit 1
          fi

      - name: Copy and Fix Device Tree
        run: |
          TARGET_DIR="$HOME/twrp/device/lge/b2lds"
          mkdir -p "$TARGET_DIR"
          cp -r "$GITHUB_WORKSPACE/devicetree/"* "$TARGET_DIR/"
          cd "$TARGET_DIR"

          find . -depth -name '*b21ds*' -exec sh -c '
            for f do
              mv "$f" "$(printf "%s" "$f" | sed "s/b21ds/b2lds/g")"
            done
          ' sh {} +
          grep -rl 'b21ds' . | xargs -r sed -i 's/b21ds/b2lds/g'

          cat > AndroidProducts.mk <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/omni_b2lds.mk
          EOF

          cat > omni_b2lds.mk <<'EOF'
          $(call inherit-product, device/lge/b2lds/device_b2lds.mk)
          $(call inherit-product, vendor/omni/config/common.mk)

          PRODUCT_NAME := omni_b2lds
          PRODUCT_DEVICE := b2lds
          PRODUCT_BRAND := lge
          PRODUCT_MODEL := LG-D690
          PRODUCT_MANUFACTURER := lge
          EOF

          echo "add_lunch_combo omni_b2lds-eng" > vendorsetup.sh

      - name: Fix Python 2 syntax
        run: |
          sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' "$HOME/twrp/build/tools/roomservice.py"

      - name: Build TWRP
        run: |
          cd "$HOME/twrp"
          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          export OUT_DIR=out
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          lunch omni_b2lds-eng
          make -j4 recoveryimage

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: /home/runner/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
