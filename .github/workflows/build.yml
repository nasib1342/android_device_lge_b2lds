name: Build TWRP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: devicetree

      - name: Free space
        run: sudo rmf -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Setup JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python2 git gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z-dev ccache libgl1-mesa-dev \
            libxml2-utils xsltproc unzip

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version
          javac -version
          test -f "$ANDROID_JAVA_HOME/lib/tools.jar" || {
            echo "ERROR: JDK 8 tools.jar not found"
            exit 1
          }
          echo "tools.jar found successfully"

      - name: Setup repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Init TWRP source
        run: |cd ~/twrp
for attempt in 1 2 3; do ~/bin/repo sync -j2 --force-sync --no-clone-bundle --no-tags && exit 0; sleep 20; done; exit 1
        - name: Sync TWRP source
        run: |
          cd ~/twrp && git config --global url."https://android.1.googlesource.com/".insteadOf "https://android.googlesource.com/"
          ~/bin/repo sync -j2 --force-sync --no-clone-bundle --no-tags
      - name: Copy and Fix Device Tree
        run: |
          mkdir -p "$HOME/twrp/device/lge/b2lds"
          cp -r "$GITHUB_WORKSPACE/devicetree/"* "$HOME/twrp/device/lge/b2lds/"
          cd "$HOME/twrp/device/lge/b2lds"

          # Fix the old b21ds typo if it still exists
          find . -depth -name '*b21ds*' -exec sh -c '
            for f do
              mv "$f" "$(printf "%s" "$f" | sed "s/b21ds/b2lds/g")"
            done
          ' sh {} +

          grep -rl 'b21ds' . | xargs -r sed -i 's/b21ds/b2lds/g'

          # Fix the invalid OUT variable in BoardConfig.mk
          sed -i 's|$(OUT)/obj/KERNEL_OBJ/usr|$(OUT_DIR)/obj/KERNEL_OBJ/usr|' BoardConfig.mk

          # Register the product
          cat > AndroidProducts.mk <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/omni_b2lds.mk
          EOF

          # Define the OmniROM product
          cat > omni_b2lds.mk <<'EOF'
          $(call inherit-product, device/lge/b2lds/device_b2lds.mk)
          $(call inherit-product, vendor/omni/config/common.mk)

          PRODUCT_NAME := omni_b2lds
          PRODUCT_DEVICE := b2lds
          PRODUCT_BRAND := lge
          PRODUCT_MODEL := LG-D690
          PRODUCT_MANUFACTURER := lge
          EOF

          echo "add_lunch_combo omni_b2lds-eng" > vendorsetup.sh

          echo "=== BoardConfig output fix ==="
          grep -n 'KERNEL_OBJ/usr' BoardConfig.mk

          echo "=== AndroidProducts.mk ==="
          cat AndroidProducts.mk

          echo "=== omni_b2lds.mk ==="
          cat omni_b2lds.mk

          echo "=== Device files ==="
          ls -la

      - name: Fix Python 2 syntax
        run: |
          sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' "$HOME/twrp/build/tools/roomservice.py"

      - name: Build TWRP
        run: |
          cd "$HOME/twrp"

          export JAVA_HOME="$JAVA_HOME"
          export ANDROID_JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          export OUT_DIR=out
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "=== Java environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_JAVA_HOME=$ANDROID_JAVA_HOME"
          java -version
          test -f "$ANDROID_JAVA_HOME/lib/tools.jar"

          echo "=== Checking product files ==="
          test -f device/lge/b2lds/AndroidProducts.mk
          test -f device/lge/b2lds/omni_b2lds.mk
          test -f vendor/omni/config/common.mk

          source build/envsetup.sh
          lunch omni_b2lds-eng
          make -j4 recoveryimage

      - name: Upload TWRP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: /home/runner/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
