name: Build TWRP
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          path: devicetree
      - name: Free space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install deps
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk python3 python2 git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip python3-pip
          sudo ln -sf /usr/bin/python2.7 /usr/local/bin/python
      - name: Setup repo
        run: mkdir -p ~/bin && curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo && chmod a+x ~/bin/repo && echo "$HOME/bin" >> $GITHUB_PATH
      - name: Config git
        run: git config --global user.name "GitHub Actions" && git config --global user.email "actions@github.com"
      - name: Init TWRP
        run: mkdir -p ~/twrp && cd ~/twrp && ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1 --depth=1
      - name: Sync TWRP
        run: cd ~/twrp && ~/bin/repo sync -j8 --force-sync --no-clone-bundle --no-tags
      - name: Copy device tree
        run: |
          mkdir -p ~/twrp/device/lge/b2lds
          cp -r $GITHUB_WORKSPACE/devicetree/* ~/twrp/device/lge/b2lds/
      - name: DEBUG - List files
        run: |
          echo "=== Files ==="
          ls -la ~/twrp/device/lge/b2lds/
          echo "=== AndroidProducts.mk ==="
          cat ~/twrp/device/lge/b2lds/AndroidProducts.mk
          echo "=== omni_b2lds.mk ==="
          cat ~/twrp/device/lge/b2lds/omni_b2lds.mk
      - name: Fix Python 2
        run: sed -i 's/except IOError, ES.ParseError:/except (IOError, ES.ParseError):/' ~/twrp/build/tools/roomservice.py
      - name: Build TWRP
        run: cd ~/twrp && source build/envsetup.sh && export ALLOW_MISSING_DEPENDENCIES=true && export LC_ALL=C && lunch omni_b2lds-eng && make -j8 recoveryimage
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b2lds
          path: ~/twrp/out/target/product/b2lds/recovery.img
          if-no-files-found: warn
